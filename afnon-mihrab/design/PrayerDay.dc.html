<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<title>Afnon Mihrab · Prayer day</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600&amp;family=Amiri:wght@400;700&amp;family=Marcellus&amp;display=swap">
<style>
body{margin:0}
a{color:#D8B46A}a:hover{color:#F0D79C}
</style>
</helmet>
<div dir="{{dir}}" lang="{{lang}}" style="position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0C1B33; color: #EFE7D6; font-family: 'Alexandria', sans-serif">

  <svg aria-hidden="true" width="600" height="900" viewBox="0 0 600 900" style="position: absolute; inset-inline-start: 96px; top: 120px">
    <path d="M0 900 L0 330 C0 170 140 70 300 0 C460 70 600 170 600 330 L600 900 Z" fill="#12264A" stroke="#D8B46A" stroke-width="3"></path>
    <path d="M18 900 L18 334 C18 184 150 92 300 22 C450 92 582 184 582 334 L582 900" fill="none" stroke="rgba(216,180,106,.45)" stroke-width="1.5"></path>
  </svg>
  <div dir="rtl" lang="ar" style="position: absolute; inset-inline-start: 156px; top: 250px; width: 480px; text-align: center">
    <p style="margin: 0; font-family: 'Amiri', serif; font-size: 32px; line-height: 1.55; color: #D8B46A"><!--quran crown br-->إِنَّ الصَّلَاةَ كَانَتْ<br>عَلَى الْمُؤْمِنِينَ<br>كِتَابًا مَّوْقُوتًا<!--/quran--></p>
  </div>
  <div style="position: absolute; inset-inline-start: 156px; top: 410px; width: 480px; text-align: center; font-size: 20px; color: #9FB0CC">{{t.ref}}</div>
  <div style="position: absolute; inset-inline-start: 136px; top: 500px; width: 520px; display: flex; flex-direction: column; align-items: center; text-align: center">
    <div style="font-size: 22px; letter-spacing: {{ls}}; color: #9FB0CC">{{t.next}}</div>
    <div style="font-family: {{fd}}; font-weight: {{fw}}; font-size: 88px; line-height: 1.15; color: #D8B46A">{{t.asr}}</div>
    <div style="font-family: {{fd}}; font-size: 150px; line-height: 1">{{count}}</div>
    <div style="font-size: 24px; color: #9FB0CC; margin-top: 16px">{{t.method}}</div>
    <div style="font-size: 24px; color: #9FB0CC">{{t.school}}</div>
  </div>

  <div style="position: absolute; inset-inline-start: 760px; top: 56px; width: 1064px; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <h1 style="margin: 0; font-family: {{fd}}; font-weight: {{fw}}; font-size: 64px; line-height: 1.1">{{t.title}}</h1>
      <div style="font-size: 26px; color: #9FB0CC">{{dates}}</div>
    </div>
    <a href="Home.dc.html" style="height: 72px; padding: 0 28px; box-sizing: border-box; border-radius: 36px; border: 2px solid rgba(239,231,214,.25); color: #EFE7D6; display: flex; align-items: center; gap: 12px; font-size: 24px; text-decoration: none">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{flip}}"><path d="M15 5l-7 7 7 7"></path></svg>
      {{t.home}}
    </a>
  </div>

  <div style="position: absolute; inset-inline-start: 760px; top: 236px; width: 620px; display: flex; flex-direction: column; gap: 12px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
      <div style="height: 104px; box-sizing: border-box; border-radius: 16px; padding-inline: 28px 20px; display: flex; align-items: center; gap: 20px; {{r.style}}">
        <span style="flex: 1; font-size: 32px; font-weight: {{r.fw}}">{{r.name}}</span>
        <span style="font-size: 22px; opacity: .85">{{r.status}}</span>
        <span style="font-family: {{fd}}; font-size: 40px; min-width: 120px; text-align: end">{{r.time}}</span>
        <span role="img" aria-label="{{r.bellLabel}}" style="width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; {{r.bellStyle}}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 21h4"></path></svg>
        </span>
      </div>
    </sc-for>
  </div>

  <div style="position: absolute; inset-inline-start: 1424px; top: 236px; width: 400px; height: 698px; box-sizing: border-box; border-radius: 24px; background: #12264A; padding: 32px; display: flex; flex-direction: column; align-items: center; gap: 20px">
    <div style="align-self: stretch; font-size: 22px; letter-spacing: {{ls}}; color: #9FB0CC">{{t.qibla}}</div>
    <svg role="img" aria-label="{{t.qiblaAria}}" width="320" height="320" viewBox="0 0 360 360">
      <circle cx="180" cy="180" r="160" fill="#0C1B33" stroke="rgba(239,231,214,.25)" stroke-width="2"></circle>
      <circle cx="180" cy="180" r="120" fill="none" stroke="rgba(239,231,214,.1)" stroke-width="1.5"></circle>
      <path d="M180 20v18M180 322v18M20 180h18M322 180h18" stroke="rgba(239,231,214,.5)" stroke-width="3"></path>
      <path d="M180 34l-10 22h20z" fill="#EFE7D6"></path>
      <line x1="180" y1="180" x2="284" y2="288" stroke="#D8B46A" stroke-width="6" stroke-linecap="round"></line>
      <rect x="272" y="276" width="26" height="26" rx="3" fill="#D8B46A" transform="rotate(46 285 289)"></rect>
      <circle cx="180" cy="180" r="10" fill="#EFE7D6"></circle>
    </svg>
    <div style="font-size: 20px; color: #9FB0CC">{{t.north}}</div>
    <div style="font-family: {{fd}}; font-size: 72px; line-height: 1; color: #D8B46A">{{deg}}</div>
    <div style="font-size: 24px; text-align: center">{{t.dir}}</div>
    <div style="font-size: 20px; color: #9FB0CC; text-align: center">{{t.qHint}}</div>
  </div>

  <div style="position: absolute; inset-inline-start: 760px; top: 976px; display: flex; gap: 40px; font-size: 22px; color: #9FB0CC">
    <sc-for list="{{t.hints}}" as="h" hint-placeholder-count="3"><span>{{h}}</span></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"locale":{"editor":"enum","options":["ar","en"],"default":"ar"},"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
renderVals() {
  var ar = (this.props.locale ?? 'ar') === 'ar';
  var d = function (s) { return ar ? String(s).replace(/[0-9]/g, function (c) { return '٠١٢٣٤٥٦٧٨٩'[+c]; }) : String(s); };
  var t = ar ? {
    ref: 'النساء ١٠٣', next: 'الصلاة القادمة', asr: 'العصر', title: 'مواقيت اليوم', home: 'الرئيسية',
    method: 'الهيئة المصرية العامة للمساحة', school: 'العصر: الجمهور (شافعي)',
    qibla: 'القبلة', qiblaAria: 'بوصلة القبلة: ١٣٦ درجة من الشمال', north: 'الشمال ▲', dir: 'جنوب شرق · من القاهرة',
    qHint: 'وجّه الشمال على البوصلة نحو الشمال الحقيقي',
    hints: ['OK  تشغيل/إيقاف الأذان لهذه الصلاة', '▶  القبلة', 'رجوع  الرئيسية'],
    names: ['الفجر', 'الشروق', 'الظهر', 'العصر', 'المغرب', 'العشاء'],
    st: ['مضت', 'مضى', 'الآن', 'بعد 27:14', 'بعد 2:52', 'بعد 4:10'], on: 'الأذان مفعّل', off: 'الأذان متوقف'
  } : {
    ref: 'An-Nisa 4:103', next: 'NEXT PRAYER', asr: 'Asr', title: "Today's prayers", home: 'Home',
    method: 'Egyptian General Authority of Survey', school: 'Asr: standard (Shafi‘i)',
    qibla: 'QIBLA', qiblaAria: 'Qibla compass: 136 degrees from north', north: '▲ North', dir: 'South-east · from Cairo',
    qHint: 'Line up the compass north with true north',
    hints: ['OK  Adhan on/off for this prayer', '▶  Qibla', 'Back  Home'],
    names: ['Fajr', 'Sunrise', 'Dhuhr', 'Asr', 'Maghrib', 'Isha'],
    st: ['passed', 'passed', 'now', 'in 27:14', 'in 2:52', 'in 4:10'], on: 'Adhan on', off: 'Adhan off'
  };
  var times = ['04:38', '06:03', '11:38', '14:48', '17:13', '18:31'];
  var rows = times.map(function (tm, i) {
    var st = i === 2 ? 'now' : (i === 3 ? 'focus' : (i < 2 ? 'past' : 'up'));
    var style = {
      now: 'background: #EFE7D6; color: #0C1B33;',
      focus: 'background: #D8B46A; color: #0C1B33; transform: scale(1.04); outline: 4px solid #EFE7D6; outline-offset: 6px;',
      past: 'background: rgba(18,38,74,.6); color: #9FB0CC;',
      up: 'background: #12264A; color: #EFE7D6;'
    }[st];
    var on = i !== 1;
    var dark = st === 'now' || st === 'focus';
    return {
      name: t.names[i], time: d(tm), status: d(t.st[i]), style: style, fw: (st === 'now' || st === 'focus') ? 600 : 400,
      bellLabel: on ? t.on : t.off,
      bellStyle: on ? (dark ? 'background: #0C1B33; color: #D8B46A;' : 'background: #1A3360; color: #D8B46A;') : 'box-shadow: inset 0 0 0 2px rgba(159,176,204,.4); color: #9FB0CC; opacity: .7;'
    };
  });
  return {
    dir: ar ? 'rtl' : 'ltr', lang: ar ? 'ar' : 'en', t: t, rows: rows,
    fd: ar ? "'Amiri', serif" : "'Marcellus', serif", fw: ar ? 700 : 400, ls: ar ? '0' : '.2em',
    flip: ar ? 'scaleX(-1)' : 'none', count: d('27:14'), deg: d('136°'),
    dates: d(ar ? 'الثلاثاء 20 أكتوبر 2026 · 9 جمادى الأولى 1448 هـ · القاهرة' : 'Tuesday 20 October 2026 · 9 Jumada al-Ula 1448 AH · Cairo')
  };
}
}
</script>
</body>
</html>
