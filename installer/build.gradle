// The phone app that installs Afnon on a TV over ADB: no computer, no adb binary. Separate from :app, which keeps
// its one-dependency rule; this one needs an ADB client and a TLS provider for Wireless debugging.
plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.afnon.installer'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.afnon.installer'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
}

dependencies {
    // ADB client: classic network debugging, Wireless debugging (TLS) and pairing codes. Apache-2.0 (dual licensed).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    // TLS 1.3 for Wireless debugging to another device; the library finds it on its own.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
}
