# The preview site (site/) on GitHub Pages, and a check that the app's generated token files
# (Tokens.java, colors.xml) still match afnon-mihrab/tokens.json.
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, just after midnight in Cairo, so the pre-rendered prayer times stay today's.
  schedule:
    - cron: '5 22 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Generated token files match tokens.json
        run: npm run tokens:check
        working-directory: site
      - name: Quranic text matches afnon-mihrab/quran.json (never typed by hand)
        run: npm run quran:check
        working-directory: site

  build:
    needs: tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install, build and upload the site
        uses: withastro/action@v6
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
